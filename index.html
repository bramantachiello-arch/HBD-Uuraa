```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 17th Birthday</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
color:white;

background:linear-gradient(135deg,#4aa3ff,#8ad0ff,#ff8fc7,#ffd0ec);
background-size:300% 300%;
animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
width:90%;
max-width:420px;
padding:35px;
border-radius:24px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(14px);
box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

h1{
font-size:32px;
margin-bottom:5px;
}

.age{
font-size:80px;
font-weight:bold;
background:linear-gradient(45deg,#ffffff,#ffd1ec);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:pulse 2.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

#typing{
min-height:28px;
margin-top:10px;
font-size:18px;
}

button{
margin-top:25px;
padding:12px 28px;
border:none;
border-radius:30px;
font-size:16px;
background:white;
color:#3a6cff;
cursor:pointer;
transition:0.25s;
box-shadow:0 6px 18px rgba(0,0,0,0.2);
}

button:hover{
transform:scale(1.08);
}

/* POPUP */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
padding:20px;
}

.modal-content{
background:linear-gradient(135deg,#4aa3ff,#ff8fc7);
padding:30px;
border-radius:20px;
max-width:420px;
width:100%;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
animation:pop 0.6s ease;
}

@keyframes pop{
0%{transform:scale(0.6);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

.modal img{
width:180px;
max-width:70%;
border-radius:14px;
margin-top:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* floating icons */

.float{
position:absolute;
animation:floatUp linear infinite;
opacity:0.9;
}

@keyframes floatUp{
0%{transform:translateY(0) scale(0.8);}
100%{transform:translateY(-110vh) scale(1.3);}
}

/* confetti */

.confetti{
position:absolute;
width:8px;
height:8px;
animation:fall 4s linear forwards;
}

@keyframes fall{
0%{transform:translateY(-10vh) rotate(0deg);}
100%{transform:translateY(110vh) rotate(720deg);}
}

/* responsive */

@media (max-width:480px){

.age{
font-size:65px;
}

h1{
font-size:26px;
}

#typing{
font-size:16px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>Happy Birthday</h1>
<div class="age">17</div>

<p id="typing"></p>

<button onclick="showSurprise()">Buka Kejutan 🎁</button>

</div>

<!-- POPUP -->

<div class="modal" id="modal">
<div class="modal-content">

<h2>Surprise 🎉</h2>

<p>
Selamat ulang tahun yang ke-17 🎂<br><br>
Semoga di usia baru ini hidupmu dipenuhi
kebahagiaan, mimpi yang tercapai,
dan banyak hari indah yang menunggumu.<br><br>
Terima kasih sudah menjadi seseorang
yang sangat berarti. 💙💗
</p>

<img src="foto.jpg">

<audio id="music">
<source src="music.mp3" type="audio/mpeg">
</audio>

</div>
</div>

<script>

/* typing text */

const text="Aku punya kejutan kecil untukmu...";
let i=0;

function typing(){
if(i<text.length){
document.getElementById("typing").innerHTML += text.charAt(i);
i++;
setTimeout(typing,60);
}
}

typing();

/* popup surprise */

function showSurprise(){

document.getElementById("modal").style.display="flex";

document.getElementById("music").play();

createConfetti();

}

/* floating icons */

function createFloat(){

const el=document.createElement("div");
el.className="float";

const icons=["💗","💙","✨","🌸","💖"];
el.innerHTML=icons[Math.floor(Math.random()*icons.length)];

el.style.left=Math.random()*100+"vw";
el.style.fontSize=(Math.random()*22+14)+"px";
el.style.animationDuration=(Math.random()*4+5)+"s";

document.body.appendChild(el);

setTimeout(()=>{el.remove()},9000);

}

setInterval(createFloat,500);

/* confetti */

function createConfetti(){

for(let i=0;i<120;i++){

const c=document.createElement("div");
c.className="confetti";

const colors=["#ff8fc7","#ffd0ec","#4aa3ff","#8ad0ff","#ffffff"];
c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.left=Math.random()*100+"vw";

document.body.appendChild(c);

setTimeout(()=>{c.remove()},4000);

}

}

</script>

</body>
</html>
```
