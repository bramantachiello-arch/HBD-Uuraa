```html
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Level 17 Unlocked</title>

<style>

body{
margin:0;
font-family:Segoe UI, sans-serif;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

/* INTRO SCREEN */

#intro{

position:absolute;
width:100%;
height:100%;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#4aa3ff,#8ad0ff,#ff8fc7);

animation:bgMove 12s infinite alternate;
}

@keyframes bgMove{
0%{filter:hue-rotate(0deg);}
100%{filter:hue-rotate(30deg);}
}

.menu-box{

background:rgba(255,255,255,0.15);
padding:40px;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 15px 40px rgba(0,0,0,0.3);

}

h1{
margin:0;
font-size:32px;
}

p{
margin-top:10px;
opacity:0.9;
}

button{

margin-top:25px;
padding:14px 32px;

border:none;
border-radius:30px;

font-size:16px;

background:white;
color:#3a6cff;

cursor:pointer;

transition:0.2s;

box-shadow:0 8px 20px rgba(0,0,0,0.3);

}

button:hover{
transform:scale(1.08);
}

/* SURPRISE SCREEN */

#surprise{

position:absolute;
width:100%;
height:100%;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:linear-gradient(160deg,#1827ff,#ff5ea9);

opacity:0;
pointer-events:none;

transition:1s;

}

#surprise.show{
opacity:1;
pointer-events:auto;
}

/* LEVEL UP */

.level{

font-size:22px;
letter-spacing:3px;
opacity:0.8;

}

.age{

font-size:120px;
font-weight:bold;

background:linear-gradient(45deg,#fff,#ffd6f0);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:levelPop 1.2s ease;

}

@keyframes levelPop{

0%{
transform:scale(0.2);
opacity:0;
}

60%{
transform:scale(1.3);
}

100%{
transform:scale(1);
}

}

/* MESSAGE */

.message{

max-width:420px;
padding:20px;

line-height:1.6;

animation:fadeText 2s;

}

@keyframes fadeText{
from{opacity:0}
to{opacity:1}
}

/* PHOTO POLAROID */

.photo{

margin-top:20px;

transform:rotate(-8deg) scale(0);

animation:photoReveal 1.2s forwards;
animation-delay:0.8s;

}

.photo img{

width:210px;
max-width:80%;

border-radius:14px;

box-shadow:0 20px 40px rgba(0,0,0,0.45);

}

@keyframes photoReveal{

0%{
transform:translateY(-200px) rotate(-20deg) scale(0);
opacity:0;
}

70%{
transform:translateY(20px) rotate(4deg) scale(1.1);
}

100%{
transform:translateY(0) rotate(-5deg) scale(1);
opacity:1;
}

}

/* CONFETTI */

.confetti{

position:absolute;

width:10px;
height:10px;

animation:confettiFall linear forwards;

}

@keyframes confettiFall{

0%{
transform:translateY(-10vh) rotate(0deg);
}

100%{
transform:translateY(110vh) rotate(720deg);
}

}

/* RESPONSIVE */

@media(max-width:480px){

.age{
font-size:80px;
}

h1{
font-size:24px;
}

}

</style>
</head>

<body>

<div id="intro">

<div class="menu-box">

<h1>Birthday Surprise</h1>

<p>Press the button to unlock something ✨</p>

<button onclick="startSurprise()">Open Surprise 🎁</button>

</div>

</div>


<div id="surprise">

<div class="level">LEVEL UP</div>

<div class="age">17</div>

<div class="message">

Selamat ulang tahun yang ke-17 🎂  
Semoga semua mimpi indahmu perlahan menjadi nyata,  
dan setiap hari di hidupmu selalu dipenuhi kebahagiaan.

</div>

<div class="photo">

<img src="uuraa.jpg">

</div>

<audio id="music">
<source src="music.mp3" type="audio/mpeg">
</audio>

</div>


<script>

/* START SURPRISE */

function startSurprise(){

explodeConfetti();

setTimeout(()=>{

document.getElementById("intro").remove();

const surprise=document.getElementById("surprise");

surprise.classList.add("show");

document.getElementById("music").play();

launchConfetti();

},600);

}


/* BUTTON CONFETTI EXPLOSION */

function explodeConfetti(){

for(let i=0;i<60;i++){

const c=document.createElement("div");

c.className="confetti";

const colors=["#ff8fc7","#ffd0ec","#4aa3ff","#8ad0ff","#ffffff"];

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.left=Math.random()*100+"vw";

c.style.animationDuration=(Math.random()*2+2)+"s";

document.body.appendChild(c);

setTimeout(()=>{c.remove()},3000);

}

}


/* CONTINUOUS CONFETTI */

function launchConfetti(){

setInterval(()=>{

const c=document.createElement("div");

c.className="confetti";

const colors=["#ff8fc7","#ffd0ec","#4aa3ff","#8ad0ff","#ffffff"];

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.left=Math.random()*100+"vw";

c.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(c);

setTimeout(()=>{c.remove()},6000);

},200);

}

</script>

</body>
</html>
```
