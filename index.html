```html
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Level 17 Unlocked</title>

<style>

body{
margin:0;
font-family:Segoe UI, sans-serif;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

/* INTRO SCREEN */

#intro{

position:absolute;
width:100%;
height:100%;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#4aa3ff,#8ad0ff,#ff8fc7);
background-size:200% 200%;
animation:bgFlow 10s ease infinite;
}

@keyframes bgFlow{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.menu{

background:rgba(255,255,255,0.15);
padding:45px;
border-radius:22px;
backdrop-filter:blur(12px);
box-shadow:0 20px 50px rgba(0,0,0,0.25);

}

.menu h1{
margin:0;
font-size:32px;
}

.menu p{
opacity:0.85;
margin-top:10px;
}

button{

margin-top:25px;

padding:14px 34px;

border:none;
border-radius:30px;

font-size:16px;

background:white;
color:#3a6cff;

cursor:pointer;

transition:0.25s;

box-shadow:0 10px 25px rgba(0,0,0,0.3);

}

button:hover{
transform:scale(1.07);
}

/* SURPRISE SCREEN */

#surprise{

position:absolute;
width:100%;
height:100%;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:linear-gradient(160deg,#1a27ff,#ff5ea9);

opacity:0;
pointer-events:none;

transition:1s;

}

#surprise.show{
opacity:1;
pointer-events:auto;
}

/* LEVEL TEXT */

.level{

letter-spacing:4px;
font-size:18px;
opacity:0.8;

}

/* AGE */

.age{

font-size:120px;
font-weight:700;

background:linear-gradient(45deg,#fff,#ffd6f0);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:0 0 20px rgba(255,255,255,0.5);

animation:agePop 1.2s ease;

}

@keyframes agePop{

0%{transform:scale(0.3);opacity:0;}
60%{transform:scale(1.25);}
100%{transform:scale(1);}

}

/* MESSAGE */

.message{

max-width:380px;
margin-top:15px;
line-height:1.6;
font-size:17px;
opacity:0.95;

animation:fadeText 2s;

}

@keyframes fadeText{
from{opacity:0}
to{opacity:1}
}

/* PHOTO */

.photo{

margin-top:18px;

transform:translateY(-200px) rotate(-8deg) scale(0.6);
opacity:0;

animation:photoDrop 1.2s forwards;
animation-delay:.7s;

}

.photo img{

width:160px;
border-radius:14px;

box-shadow:0 18px 35px rgba(0,0,0,0.45);

}

@keyframes photoDrop{

0%{
transform:translateY(-220px) rotate(-20deg) scale(.5);
opacity:0;
}

70%{
transform:translateY(10px) rotate(5deg) scale(1.05);
}

100%{
transform:translateY(0) rotate(-6deg) scale(1);
opacity:1;
}

}

/* CONFETTI */

.confetti{

position:absolute;
width:10px;
height:10px;

animation:confettiFall linear forwards;

}

@keyframes confettiFall{

0%{
transform:translateY(-10vh) rotate(0deg);
}

100%{
transform:translateY(110vh) rotate(720deg);
}

}

/* RESPONSIVE */

@media(max-width:480px){

.age{font-size:80px;}

.menu{padding:30px;}

.photo img{width:140px;}

}

</style>
</head>

<body>

<div id="intro">

<div class="menu">

<h1>Birthday Surprise</h1>

<p>Something small waiting for you ✨</p>

<button onclick="startSurprise()">Open Surprise</button>

</div>

</div>


<div id="surprise">

<div class="level">LEVEL UP</div>

<div class="age">17</div>

<div class="message">

Selamat ulang tahun yang ke-17 🎂  
Semoga setiap langkahmu membawa cerita baru,  
dan semua hal baik selalu menemukan jalan menuju hidupmu.

</div>

<div class="photo">
<img src="uuraa.jpg">
</div>

</div>


<script>

/* START SURPRISE */

function startSurprise(){

explodeConfetti();

setTimeout(()=>{

document.getElementById("intro").remove();

const surprise=document.getElementById("surprise");

surprise.classList.add("show");

launchConfetti();

},500);

}

/* CONFETTI EXPLOSION */

function explodeConfetti(){

for(let i=0;i<70;i++){

createConfetti();

}

}

/* CONTINUOUS CONFETTI */

function launchConfetti(){

setInterval(()=>{

createConfetti();

},200);

}

function createConfetti(){

const c=document.createElement("div");

c.className="confetti";

const colors=["#ff8fc7","#ffd0ec","#4aa3ff","#8ad0ff","#ffffff"];

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.left=Math.random()*100+"vw";

c.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(c);

setTimeout(()=>{c.remove()},6000);

}

</script>

</body>
</html>
```
