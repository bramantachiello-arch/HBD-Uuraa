```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 17th Birthday</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
text-align:center;

background:linear-gradient(135deg,#4aa3ff,#8ad0ff,#ff8fc7,#ffd0ec);
background-size:300% 300%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* MAIN CARD */

.container{
width:90%;
max-width:420px;
padding:35px;
border-radius:22px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(14px);
box-shadow:0 15px 40px rgba(0,0,0,0.25);

transition:0.6s;
}

.container.hide{
opacity:0;
transform:scale(.9);
pointer-events:none;
}

h1{
font-size:30px;
margin-bottom:8px;
}

.age{
font-size:80px;
font-weight:bold;
background:linear-gradient(45deg,#ffffff,#ffd1ec);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:pulse 2.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}

#typing{
min-height:28px;
margin-top:12px;
font-size:18px;
opacity:0;
animation:fadeText 1s forwards;
animation-delay:1s;
}

@keyframes fadeText{
to{opacity:1;}
}

button{
margin-top:28px;
padding:12px 28px;
border:none;
border-radius:30px;
font-size:16px;
background:white;
color:#3a6cff;
cursor:pointer;
transition:.25s;
box-shadow:0 6px 18px rgba(0,0,0,0.2);
}

button:hover{
transform:scale(1.08);
}

/* POPUP */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000cc;
display:flex;
justify-content:center;
align-items:center;

opacity:0;
pointer-events:none;
transition:0.6s;
}

.modal.show{
opacity:1;
pointer-events:auto;
}

.modal-card{

background:linear-gradient(135deg,#4aa3ff,#ff8fc7);
padding:30px;
border-radius:20px;
max-width:420px;
width:90%;

box-shadow:0 15px 40px rgba(0,0,0,0.4);

transform:scale(.7);
opacity:0;

animation:popUp .8s forwards;
}

@keyframes popUp{
to{
transform:scale(1);
opacity:1;
}
}

.modal-card img{
width:190px;
max-width:80%;
border-radius:14px;
margin-top:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* confetti */

.confetti{
position:absolute;
width:8px;
height:8px;
animation:fall 4s linear forwards;
}

@keyframes fall{
0%{transform:translateY(-10vh) rotate(0deg);}
100%{transform:translateY(110vh) rotate(720deg);}
}

/* floating cute icons */

.float{
position:absolute;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-110vh);}
}

/* responsive */

@media (max-width:480px){

.age{font-size:60px;}
h1{font-size:24px;}
#typing{font-size:16px;}

}

</style>
</head>

<body>

<div class="container" id="mainCard">

<h1>Happy Birthday</h1>
<div class="age">17</div>

<p id="typing"></p>

<button onclick="openSurprise()">Buka Kejutan 🎁</button>

</div>


<div class="modal" id="modal">

<div class="modal-card">

<h2>Surprise 🎉</h2>

<p>
Selamat ulang tahun yang ke-17 🎂 <br><br>
Semoga semua mimpi indahmu
pelan-pelan menjadi nyata,
dan setiap harimu selalu dipenuhi
kebahagiaan yang sederhana tapi berarti. <br><br>

Terima kasih sudah menjadi
orang yang sangat spesial. 💙💗
</p>

<img src="foto.jpg">

<audio id="music">
<source src="music.mp3" type="audio/mpeg">
</audio>

</div>
</div>


<script>

/* TYPEWRITER TEXT */

const text="Aku punya kejutan kecil untukmu...";
let i=0;

function typing(){

if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(typing,55);
}

}

setTimeout(typing,1000);


/* OPEN SURPRISE */

function openSurprise(){

document.getElementById("mainCard").classList.add("hide");

setTimeout(()=>{

document.getElementById("modal").classList.add("show");

document.getElementById("music").play();

createConfetti();

},500);

}


/* CONFETTI */

function createConfetti(){

for(let i=0;i<120;i++){

const c=document.createElement("div");
c.className="confetti";

const colors=["#ff8fc7","#ffd0ec","#4aa3ff","#8ad0ff","#ffffff"];
c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.left=Math.random()*100+"vw";

document.body.appendChild(c);

setTimeout(()=>{c.remove()},4000);

}

}


/* FLOATING HEARTS */

function floatHearts(){

const el=document.createElement("div");
el.className="float";

const icons=["💗","💙","✨","🌸"];
el.innerHTML=icons[Math.floor(Math.random()*icons.length)];

el.style.left=Math.random()*100+"vw";
el.style.fontSize=(Math.random()*22+16)+"px";
el.style.animationDuration=(Math.random()*5+6)+"s";

document.body.appendChild(el);

setTimeout(()=>{el.remove()},9000);

}

setInterval(floatHearts,600);

</script>

</body>
</html>
