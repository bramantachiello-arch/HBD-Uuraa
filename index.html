```html
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;

background:linear-gradient(135deg,#4aa3ff,#8ad0ff,#ff8fc7,#ffd0ec);
background-size:300% 300%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* INTRO */

#intro{

width:90%;
max-width:420px;
padding:35px;
border-radius:22px;

background:rgba(255,255,255,0.15);
backdrop-filter:blur(14px);

box-shadow:0 15px 40px rgba(0,0,0,0.25);

animation:introAppear 1s ease;

}

@keyframes introAppear{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

h1{
margin:0;
font-size:30px;
}

#typing{
margin-top:15px;
font-size:18px;
min-height:25px;
}

button{

margin-top:25px;

padding:12px 28px;

border:none;
border-radius:30px;

background:white;
color:#3a6cff;

font-size:16px;
cursor:pointer;

box-shadow:0 6px 18px rgba(0,0,0,0.2);

transition:.2s;

}

button:hover{
transform:scale(1.08);
}


/* SURPRISE SCREEN */

#surprise{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

background:linear-gradient(160deg,#1b2cff,#ff5ea9);

opacity:0;
pointer-events:none;

transition:0.8s;

}

#surprise.show{

opacity:1;
pointer-events:auto;

}


/* AGE ANIMATION */

.age{

font-size:120px;
font-weight:bold;

background:linear-gradient(45deg,#ffffff,#ffd6f0);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:agePop 1.2s ease;

}

@keyframes agePop{

0%{transform:scale(0.3); opacity:0;}
60%{transform:scale(1.2);}
100%{transform:scale(1);}

}

.message{

max-width:420px;
margin-top:20px;
font-size:18px;
line-height:1.6;
padding:0 20px;

animation:textFade 2s ease;

}

@keyframes textFade{
from{opacity:0;}
to{opacity:1;}
}

.photo img{

margin-top:20px;
width:200px;
max-width:80%;
border-radius:16px;

box-shadow:0 12px 30px rgba(0,0,0,0.4);

}


/* CONFETTI */

.confetti{

position:absolute;
width:10px;
height:10px;

animation:confettiFall linear forwards;

}

@keyframes confettiFall{

0%{
transform:translateY(-10vh) rotate(0deg);
}

100%{
transform:translateY(110vh) rotate(720deg);
}

}


/* RESPONSIVE */

@media(max-width:480px){

.age{
font-size:80px;
}

h1{
font-size:24px;
}

.message{
font-size:16px;
}

}

</style>
</head>

<body>

<div id="intro">

<h1>Happy Birthday</h1>

<p id="typing"></p>

<button onclick="startSurprise()">Buka Kejutan 🎁</button>

</div>


<div id="surprise">

<div class="age">17</div>

<div class="message">

Selamat ulang tahun yang ke-17 🎂  
Semoga semua mimpi indahmu perlahan menjadi nyata,  
dan setiap hari di hidupmu dipenuhi kebahagiaan.  

Terima kasih sudah menjadi seseorang yang sangat berarti 💙💗

</div>

<div class="photo">

<img src="foto.jpg">

</div>

<audio id="music">
<source src="music.mp3" type="audio/mpeg">
</audio>

</div>


<script>

/* TYPEWRITER */

const text="Aku punya sesuatu untukmu...";
let i=0;

function typing(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,55);

}

}

typing();


/* START SURPRISE */

function startSurprise(){

document.getElementById("intro").remove();

const surprise=document.getElementById("surprise");

surprise.classList.add("show");

document.getElementById("music").play();

launchConfetti();

}


/* CONFETTI RANDOM */

function launchConfetti(){

for(let i=0;i<150;i++){

const c=document.createElement("div");

c.className="confetti";

const colors=["#ff8fc7","#ffd0ec","#4aa3ff","#8ad0ff","#ffffff"];

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.left=Math.random()*100+"vw";

c.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(c);

setTimeout(()=>{c.remove()},6000);

}

}

</script>

</body>
</html>
```
